<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figma / 网页还原对照</title><style>body{font:14px system-ui;margin:24px;background:#f4f5f7;color:#1c1e23}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:20px;margin:0}select{padding:8px}a{color:#0077fa}.compare{width:min(1440px,100%);position:relative;aspect-ratio:1440/900;background:white}.compare img{position:absolute;inset:0;width:100%;height:100%}.front{clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#f43f5e;pointer-events:none}.legend{display:flex;justify-content:space-between;max-width:1440px;margin:12px 0;color:#606773}input{width:min(1440px,100%);accent-color:#0077fa}p{color:#626974;line-height:1.6}</style><header><h1>Figma / 网页还原对照</h1><select id="screen" aria-label="页面"><option value="home">首页</option><option value="new-project">新建项目</option><option value="feedback">反馈页</option><option value="plan">修改计划</option><option value="candidates">候选页</option><option value="preview">候选详情</option></select><a href="index.html">打开交互原型</a></header><div class="legend"><span>左侧：Figma 原稿</span><span>右侧：浏览器实际截图</span></div><div class="compare"><img id="web" alt="网页截图"><img id="figma" class="front" alt="Figma 原稿"><div class="line"></div></div><input id="slider" type="range" min="0" max="100" value="50" aria-label="拖动对比位置"><p>基准为 Figma 当前六个 1440 × 900 页面。拖动滑块检查布局、资产、字体与细节。此页仅用于截图验收；交互原型由实际 HTML 元素构成。</p><script>const select=document.getElementById('screen'),slider=document.getElementById('slider');function load(){document.getElementById('web').src='reference/web-'+select.value+'.png';document.getElementById('figma').src='reference/'+select.value+'.png'}select.onchange=load;slider.oninput=()=>{document.getElementById('figma').style.clipPath='inset(0 '+(100-slider.value)+'% 0 0)';document.querySelector('.line').style.left=slider.value+'%'};load();</script></html>
